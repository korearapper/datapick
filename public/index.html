<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATAPICK - 쿠팡 DB 추출</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0a0a12;color:#e0e0e0;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a4a}
.logo{font-size:22px;font-weight:800;background:linear-gradient(135deg,#ff6b35,#f7c948);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo span{font-size:12px;-webkit-text-fill-color:#888;margin-left:8px;font-weight:400}
.user-info{display:flex;align-items:center;gap:16px;font-size:14px}
.points{background:#ff6b35;color:#fff;padding:4px 12px;border-radius:20px;font-weight:700;font-size:13px}
.btn{padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#ff6b35,#e85d26);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(255,107,53,.3)}
.btn-secondary{background:#2a2a4a;color:#ccc;border:1px solid #3a3a5a}
.btn-secondary:hover{background:#3a3a5a}
.btn-danger{background:#e74c3c;color:#fff}
.container{max-width:1400px;margin:0 auto;padding:20px}

/* 로그인 */
.login-wrap{display:flex;justify-content:center;align-items:center;min-height:80vh}
.login-box{background:#1a1a2e;padding:40px;border-radius:16px;width:380px;border:1px solid #2a2a4a}
.login-box h2{text-align:center;margin-bottom:24px;color:#ff6b35}
.input-group{margin-bottom:16px}
.input-group label{display:block;margin-bottom:6px;font-size:13px;color:#888}
.input-group input{width:100%;padding:10px 14px;background:#0a0a12;border:1px solid #2a2a4a;border-radius:8px;color:#fff;font-size:14px}
.input-group input:focus{outline:none;border-color:#ff6b35}

/* 메인 */
.search-card{background:#1a1a2e;padding:24px;border-radius:12px;border:1px solid #2a2a4a;margin-bottom:20px}
.search-card h3{color:#ff6b35;margin-bottom:16px;font-size:16px}
.search-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.search-row .input-group{margin-bottom:0;flex:1;min-width:120px}
.search-row .input-group.keyword{flex:3}
.search-row .input-group.rank{flex:1;min-width:80px}

/* 결과 */
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.result-stats{font-size:14px;color:#888}
.result-stats b{color:#ff6b35}
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid #2a2a4a}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1100px}
th{background:#16213e;color:#ff6b35;padding:10px 8px;text-align:left;font-weight:600;position:sticky;top:0;white-space:nowrap;border-bottom:2px solid #2a2a4a}
td{padding:8px;border-bottom:1px solid #1a1a2e;vertical-align:top;max-width:280px;word-break:break-word}
tr:hover{background:#16213e}
tr.ad-row{opacity:.5}
.rank-cell{font-weight:700;color:#ff6b35;text-align:center;width:40px}
.rocket{background:#5865f2;color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:4px}
.img-thumb{width:48px;height:48px;border-radius:6px;object-fit:cover}
.seller-info{font-size:12px;color:#aaa;line-height:1.6}
.seller-info b{color:#e0e0e0}
a{color:#4da6ff;text-decoration:none}
a:hover{text-decoration:underline}

/* 로딩 */
.loading{display:none;text-align:center;padding:40px}
.loading.active{display:block}
.spinner{width:40px;height:40px;border:4px solid #2a2a4a;border-top:4px solid #ff6b35;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-text{color:#888;font-size:14px}

/* CSV 다운로드 */
.download-btn{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;padding:8px 20px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.download-btn:hover{opacity:.9}

/* 관리자 */
.admin-panel{background:#1a1a2e;padding:20px;border-radius:12px;border:1px solid #2a2a4a;margin-bottom:20px}
.admin-panel h3{color:#f7c948;margin-bottom:12px}
.admin-table{width:100%;font-size:13px}
.admin-table th{background:#0a0a12;color:#f7c948}
.admin-table td{padding:6px 8px;border-bottom:1px solid #16213e}

@media(max-width:768px){
  .search-row{flex-direction:column}
  .search-row .input-group{min-width:100%}
}
</style>
</head>
<body>
<div class="header">
  <div class="logo">DATAPICK <span>쿠팡 DB 추출</span></div>
  <div class="user-info" id="userInfo" style="display:none">
    <span id="userName"></span>
    <span class="points" id="userPoints"></span>
    <button class="btn btn-secondary" onclick="logout()">로그아웃</button>
  </div>
</div>

<div class="container">
  <!-- 로그인 -->
  <div id="loginPage" class="login-wrap">
    <div class="login-box">
      <h2>🔐 LOGIN</h2>
      <div class="input-group"><label>아이디</label><input id="loginId" placeholder="admin"></div>
      <div class="input-group"><label>비밀번호</label><input id="loginPw" type="password" placeholder="admin1234"></div>
      <button class="btn btn-primary" style="width:100%;padding:12px;margin-top:8px" onclick="login()">로그인</button>
      <p id="loginError" style="color:#e74c3c;text-align:center;margin-top:10px;font-size:13px"></p>
    </div>
  </div>

  <!-- 메인 -->
  <div id="mainPage" style="display:none">
    <!-- 관리자 패널 -->
    <div id="adminPanel" class="admin-panel" style="display:none">
      <h3>⚙️ 관리자</h3>
      <div id="adminUsers"></div>
    </div>

    <!-- 검색 -->
    <div class="search-card">
      <h3>🛒 쿠팡 키워드 DB 추출</h3>
      <div class="search-row">
        <div class="input-group keyword">
          <label>키워드</label>
          <input id="keyword" placeholder="예: 수면잠옷, 블루투스이어폰, 비타민D">
        </div>
        <div class="input-group rank">
          <label>시작순위</label>
          <input id="startRank" type="number" value="1" min="1">
        </div>
        <div class="input-group rank">
          <label>끝순위</label>
          <input id="endRank" type="number" value="50" min="1">
        </div>
        <button class="btn btn-primary" id="extractBtn" onclick="extract()" style="height:38px;min-width:120px">🚀 추출 시작</button>
      </div>
      <p style="margin-top:10px;font-size:12px;color:#666">
        1건 = 1P | 광고 제외 순수 검색순위 | 판매자정보(업체명·전화·대표자·사업자번호) 자동 추출
      </p>
    </div>

    <!-- 로딩 -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="progress-text" id="progressText">쿠팡 검색 크롤링 중...</div>
    </div>

    <!-- 결과 -->
    <div id="resultArea" style="display:none">
      <div class="result-header">
        <div class="result-stats" id="resultStats"></div>
        <div style="display:flex;gap:8px">
          <button class="download-btn" onclick="downloadCSV()">📥 CSV 다운로드</button>
          <button class="btn btn-secondary" onclick="clearResults()">🗑️ 초기화</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>순위</th>
              <th>이미지</th>
              <th>상품명</th>
              <th>가격</th>
              <th>리뷰</th>
              <th>판매업체</th>
              <th>전화번호</th>
              <th>대표자</th>
              <th>사업자번호</th>
              <th>배송</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let currentUser = null;
let lastData = [];

async function apiFetch(url, opts = {}) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'API 오류');
  return j;
}

async function checkLogin() {
  try {
    const d = await apiFetch('/api/me');
    currentUser = d.user;
    showMain();
  } catch { showLogin(); }
}

function showLogin() {
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('mainPage').style.display = 'none';
  document.getElementById('userInfo').style.display = 'none';
}

function showMain() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('mainPage').style.display = 'block';
  document.getElementById('userInfo').style.display = 'flex';
  document.getElementById('userName').textContent = currentUser.username;
  document.getElementById('userPoints').textContent = currentUser.points.toLocaleString() + 'P';
  if (currentUser.isAdmin) loadAdmin();
}

async function login() {
  try {
    const d = await apiFetch('/api/login', { method: 'POST', body: JSON.stringify({ username: document.getElementById('loginId').value, password: document.getElementById('loginPw').value }) });
    currentUser = d.user;
    showMain();
  } catch (e) { document.getElementById('loginError').textContent = e.message; }
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  currentUser = null;
  showLogin();
}

// 엔터키 로그인
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('loginPage').style.display !== 'none') login();
});

// 추출
async function extract() {
  const kw = document.getElementById('keyword').value.trim();
  if (!kw) return alert('키워드를 입력하세요');
  const sr = parseInt(document.getElementById('startRank').value) || 1;
  const er = parseInt(document.getElementById('endRank').value) || 50;
  if (er < sr) return alert('끝순위가 시작순위보다 작습니다');

  document.getElementById('extractBtn').disabled = true;
  document.getElementById('loading').classList.add('active');
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('progressText').textContent = `🔍 "${kw}" 검색 크롤링 중... (${sr}~${er}위)`;

  try {
    const d = await apiFetch('/api/extract/coupang', {
      method: 'POST',
      body: JSON.stringify({ keyword: kw, startRank: sr, endRank: er }),
    });

    lastData = d.data || [];
    currentUser.points = d.remainingPoints;
    document.getElementById('userPoints').textContent = d.remainingPoints.toLocaleString() + 'P';

    renderResults(kw, sr, er, d.usedPoints);
  } catch (e) {
    alert(e.message);
  } finally {
    document.getElementById('extractBtn').disabled = false;
    document.getElementById('loading').classList.remove('active');
  }
}

function renderResults(kw, sr, er, used) {
  const area = document.getElementById('resultArea');
  const body = document.getElementById('resultBody');
  const stats = document.getElementById('resultStats');

  const total = lastData.length;
  const withSeller = lastData.filter(d => d.sellerName || d.sellerTel).length;
  const withTel = lastData.filter(d => d.sellerTel).length;

  stats.innerHTML = `
    <b>"${kw}"</b> ${sr}~${er}위 |
    총 <b>${total}</b>건 |
    판매업체 <b>${withSeller}</b>건 |
    전화번호 <b>${withTel}</b>건 |
    사용 <b>${used}P</b>
  `;

  body.innerHTML = '';
  lastData.forEach(d => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rank-cell">${d.rank}</td>
      <td>${d.image ? `<img class="img-thumb" src="${d.image}" onerror="this.style.display='none'">` : '-'}</td>
      <td>
        ${d.productUrl ? `<a href="${d.productUrl}" target="_blank">${esc(d.productName)}</a>` : esc(d.productName)}
        ${d.isRocket ? '<span class="rocket">로켓</span>' : ''}
        ${d.discount ? `<span style="color:#e74c3c;font-size:11px;margin-left:4px">${esc(d.discount)}</span>` : ''}
      </td>
      <td style="white-space:nowrap">${d.price ? Number(d.price).toLocaleString() + '원' : '-'}${d.basePrice && d.basePrice !== d.price ? `<br><s style="color:#666;font-size:11px">${Number(d.basePrice).toLocaleString()}</s>` : ''}</td>
      <td style="white-space:nowrap">${d.rating ? '⭐' + d.rating : ''}<br>${d.reviewCount ? '(' + d.reviewCount.toLocaleString() + ')' : ''}</td>
      <td><b>${esc(d.sellerName) || '-'}</b></td>
      <td style="white-space:nowrap;color:#4da6ff">${esc(d.sellerTel) || '-'}</td>
      <td>${esc(d.sellerCeo) || '-'}</td>
      <td style="font-size:11px;color:#888">${esc(d.bizNo) || '-'}</td>
      <td>${d.isRocket ? '🚀' : '📦'}</td>
    `;
    body.appendChild(tr);
  });

  area.style.display = 'block';
}

function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function clearResults() {
  lastData = [];
  document.getElementById('resultArea').style.display = 'none';
}

function downloadCSV() {
  if (!lastData.length) return;
  const headers = ['순위','상품명','가격','할인전가격','할인율','별점','리뷰수','판매업체','전화번호','대표자','사업자번호','로켓배송','상품URL','상품ID'];
  const rows = lastData.map(d => [
    d.rank, `"${(d.productName||'').replace(/"/g,'""')}"`, d.price, d.basePrice, d.discount, d.rating, d.reviewCount,
    `"${(d.sellerName||'').replace(/"/g,'""')}"`, d.sellerTel, d.sellerCeo, d.bizNo,
    d.isRocket ? 'Y' : 'N', d.productUrl, d.productId
  ]);
  const bom = '\uFEFF';
  const csv = bom + headers.join(',') + '\n' + rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `쿠팡_${document.getElementById('keyword').value}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

async function loadAdmin() {
  const panel = document.getElementById('adminPanel');
  panel.style.display = 'block';
  try {
    const d = await apiFetch('/api/admin/users');
    const html = `<table class="admin-table"><thead><tr><th>ID</th><th>아이디</th><th>포인트</th><th>관리</th></tr></thead><tbody>${
      d.users.map(u => `<tr><td>${u.id}</td><td>${u.username}${u.is_admin?' ⭐':''}</td><td>${u.points.toLocaleString()}P</td><td><button class="btn btn-secondary" style="padding:2px 8px;font-size:11px" onclick="addPoints(${u.id})">포인트</button></td></tr>`).join('')
    }</tbody></table>`;
    document.getElementById('adminUsers').innerHTML = html;
  } catch {}
}

async function addPoints(uid) {
  const amt = parseInt(prompt('포인트 (양수=충전, 음수=차감)'));
  if (isNaN(amt)) return;
  const desc = prompt('사유', '관리자 충전') || '관리자 조정';
  try {
    await apiFetch('/api/admin/points', { method: 'POST', body: JSON.stringify({ userId: uid, amount: amt, description: desc }) });
    loadAdmin();
    checkLogin();
  } catch (e) { alert(e.message); }
}

checkLogin();
</script>
</body>
</html>
