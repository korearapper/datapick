<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATAPICK - 네이버 플레이스 DB 추출</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }

  /* 로그인 */
  .login-wrap { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .login-box { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 12px; padding: 40px; width: 400px; }
  .login-box h1 { text-align: center; margin-bottom: 30px; color: #7c6ff7; font-size: 28px; }
  .login-box input { width: 100%; padding: 12px 16px; margin-bottom: 12px; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 8px; color: #fff; font-size: 14px; }
  .login-box button { width: 100%; padding: 12px; background: #7c6ff7; border: none; border-radius: 8px; color: #fff; font-size: 16px; cursor: pointer; font-weight: 600; }
  .login-box button:hover { background: #6a5ce0; }

  /* 메인 */
  .main-wrap { display: none; }
  .header { background: #1a1d27; border-bottom: 1px solid #2a2d3a; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { color: #7c6ff7; font-size: 22px; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .points-badge { background: #7c6ff720; border: 1px solid #7c6ff750; padding: 6px 16px; border-radius: 20px; color: #7c6ff7; font-weight: 600; }
  .logout-btn { background: none; border: 1px solid #444; padding: 6px 14px; border-radius: 6px; color: #aaa; cursor: pointer; }

  /* 추출 패널 */
  .content { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
  .extract-panel { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 12px; padding: 30px; margin-bottom: 24px; }
  .extract-panel h2 { margin-bottom: 20px; font-size: 18px; }
  .input-row { display: flex; gap: 12px; align-items: flex-end; }
  .input-group { flex: 1; }
  .input-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #888; }
  .input-group input { width: 100%; padding: 10px 14px; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 8px; color: #fff; font-size: 14px; }
  .extract-btn { padding: 10px 30px; background: #7c6ff7; border: none; border-radius: 8px; color: #fff; font-size: 15px; cursor: pointer; font-weight: 600; white-space: nowrap; height: 42px; }
  .extract-btn:hover { background: #6a5ce0; }
  .extract-btn:disabled { background: #444; cursor: not-allowed; }
  .extract-info { margin-top: 12px; font-size: 13px; color: #666; }

  /* 로딩 */
  .loading { display: none; text-align: center; padding: 40px; }
  .spinner { border: 3px solid #2a2d3a; border-top: 3px solid #7c6ff7; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 결과 테이블 */
  .result-panel { display: none; background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 12px; overflow: hidden; }
  .result-header { padding: 16px 24px; border-bottom: 1px solid #2a2d3a; display: flex; justify-content: space-between; align-items: center; }
  .result-header h3 { font-size: 16px; }
  .download-btn { padding: 8px 20px; background: #22c55e; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #12141c; padding: 10px 14px; text-align: left; font-size: 13px; color: #888; border-bottom: 1px solid #2a2d3a; }
  td { padding: 10px 14px; border-bottom: 1px solid #1e2130; font-size: 13px; }
  tr:hover { background: #1e2130; }
  .empty { color: #555; }

  .error-msg { color: #ef4444; margin-top: 12px; font-size: 14px; display: none; }
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h1>DATAPICK</h1>
    <input type="text" id="loginId" placeholder="아이디">
    <input type="password" id="loginPw" placeholder="비밀번호" onkeypress="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">로그인</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- 메인 -->
<div class="main-wrap" id="mainWrap">
  <div class="header">
    <h1>DATAPICK</h1>
    <div class="header-right">
      <span class="points-badge" id="pointsBadge">0 P</span>
      <span id="userName" style="color:#aaa;font-size:14px;"></span>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="content">
    <div class="extract-panel">
      <h2>🔍 네이버 플레이스 추출</h2>
      <div class="input-row">
        <div class="input-group">
          <label>키워드</label>
          <input type="text" id="keyword" placeholder="예: 인천논현맛집" onkeypress="if(event.key==='Enter')doExtract()">
        </div>
        <button class="extract-btn" id="extractBtn" onclick="doExtract()">1위~75위 추출하기</button>
      </div>
      <div class="extract-info">💡 키워드를 입력하고 추출하면 1위~75위 업체의 이름, 전화번호, 주소, 카테고리를 가져옵니다. (75P 차감)</div>
      <div class="error-msg" id="extractError"></div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>데이터 추출 중... (약 30초~1분 소요)</p>
    </div>

    <div class="result-panel" id="resultPanel">
      <div class="result-header">
        <h3 id="resultTitle">추출 결과</h3>
        <button class="download-btn" onclick="downloadCSV()">📥 CSV 다운로드</button>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>순위</th>
              <th>업체명</th>
              <th>전화번호</th>
              <th>주소</th>
              <th>카테고리</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let currentData = [];

async function doLogin() {
  const username = document.getElementById('loginId').value;
  const password = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }

    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('mainWrap').style.display = 'block';
    document.getElementById('pointsBadge').textContent = data.user.points.toLocaleString() + ' P';
    document.getElementById('userName').textContent = data.user.username;
  } catch (e) {
    errEl.textContent = '서버 연결 실패';
    errEl.style.display = 'block';
  }
}

async function checkLogin() {
  try {
    const res = await fetch('/api/me');
    if (res.ok) {
      const data = await res.json();
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('mainWrap').style.display = 'block';
      document.getElementById('pointsBadge').textContent = data.user.points.toLocaleString() + ' P';
      document.getElementById('userName').textContent = data.user.username;
    }
  } catch (e) {}
}

async function doLogout() {
  await fetch('/api/logout', { method: 'POST' });
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('mainWrap').style.display = 'none';
}

async function doExtract() {
  const keyword = document.getElementById('keyword').value.trim();
  const errEl = document.getElementById('extractError');
  errEl.style.display = 'none';

  if (!keyword) { errEl.textContent = '키워드를 입력해주세요.'; errEl.style.display = 'block'; return; }

  document.getElementById('extractBtn').disabled = true;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('resultPanel').style.display = 'none';

  try {
    const res = await fetch('/api/extract/place', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keyword })
    });
    const data = await res.json();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('extractBtn').disabled = false;

    if (!res.ok) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }

    document.getElementById('pointsBadge').textContent = data.remainingPoints.toLocaleString() + ' P';

    currentData = data.data;
    const tbody = document.getElementById('resultBody');
    tbody.innerHTML = '';

    for (const item of data.data) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.rank}</td>
        <td>${item.name || '<span class="empty">-</span>'}</td>
        <td>${item.tel || '<span class="empty">-</span>'}</td>
        <td>${item.address || '<span class="empty">-</span>'}</td>
        <td>${item.category || '<span class="empty">-</span>'}</td>
      `;
      tbody.appendChild(tr);
    }

    document.getElementById('resultTitle').textContent = `"${keyword}" 추출 결과 (${data.data.length}건, -${data.usedPoints}P)`;
    document.getElementById('resultPanel').style.display = 'block';

  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('extractBtn').disabled = false;
    errEl.textContent = '서버 오류: ' + e.message;
    errEl.style.display = 'block';
  }
}

function downloadCSV() {
  if (!currentData.length) return;
  const BOM = '\uFEFF';
  let csv = BOM + '순위,업체명,전화번호,주소,카테고리\n';
  for (const d of currentData) {
    csv += `${d.rank},"${(d.name||'').replace(/"/g,'""')}","${(d.tel||'').replace(/"/g,'""')}","${(d.address||'').replace(/"/g,'""')}","${(d.category||'').replace(/"/g,'""')}"\n`;
  }
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `datapick_${document.getElementById('keyword').value}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

checkLogin();
</script>
</body>
</html>
